AllCops:
  TargetRubyVersion: 3.4

# One class (BaaderBank::Client) is reopened across lib/baader_bank/client/*.rb,
# one file per OpenAPI tag - each reopening doesn't need its own class-level doc.
Style/Documentation:
  Enabled: false

# Upload methods mirror the API's own required/optional field lists.
Metrics/ParameterLists:
  Max: 6

Metrics/AbcSize:
  Exclude:
    - "lib/baader_bank/client.rb"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*.rb"

Metrics/MethodLength:
  Exclude:
    - "spec/spec_helper.rb"
