name: Publish gem

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake

      - name: Verify release version
        run: |
          gem_version="$(ruby -Ilib -rbaader_bank/version -e 'print BaaderBank::VERSION')"
          test "${GITHUB_REF_NAME}" = "v${gem_version}"

      - name: Build gem
        run: gem build baader_bank.gemspec

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p "$HOME/.gem"
          printf -- "---\n:github: ${GEM_HOST_API_KEY}\n" > "$HOME/.gem/credentials"
          chmod 0600 "$HOME/.gem/credentials"
        env:
          GEM_HOST_API_KEY: Bearer ${{ secrets.GITHUB_TOKEN }}

      - name: Publish gem
        run: |
          gem push \
            --key github \
            --host "https://rubygems.pkg.github.com/${{ github.repository_owner }}" \
            baader_bank-*.gem
